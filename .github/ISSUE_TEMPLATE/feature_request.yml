name: Feature request
description: Suggest a new capability for browserops.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow you can't accomplish today, or the friction you hit.
      placeholder: "I want my agent to be able to..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you imagine the feature working? Be specific about the tool name, parameters, or CLI command if applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds have you tried? Why aren't they enough?

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      multiple: true
      options:
        - New MCP tool (browser_* or procedures_* or lore_*)
        - Change to existing MCP tool
        - CLI command
        - Extension UI (popup, options, onboarding)
        - Procedure runtime / schema
        - Documentation
        - Other
    validations:
      required: true
