schema_version: 1

name: meta.clear_field
description: Focus a field by ref and clear it via Primary+A → Delete — works on inputs, textareas, and contenteditable editors
kind: leaf
domain: meta

triggers:
  - clear this field
  - empty this input
  - wipe the text
  - erase the contents
  - reset the field

tags: [meta, keyboard, chord, clearing]

inputs:
  ref:
    type: number
    required: true
    description: Ref (from a prior browser_read a11y_tree) of the field to clear

# browser_type.clear_mode already handles the clearing path when you're
# about to type new text. Use this leaf when you need clearing as its own
# step (e.g. clear a draft without typing a replacement, or clear
# something an agent-authored step left behind). Primary resolves to Meta
# on macOS and Control elsewhere, so this chord is portable.
steps:
  - id: focus
    action: browser_click
    with:
      tab_id: "{{tab_id}}"
      ref: "{{input.ref}}"

  - id: select_all
    action: browser_press
    with:
      tab_id: "{{tab_id}}"
      keys: ["Primary", "KeyA"]

  - id: delete
    action: browser_press
    with:
      tab_id: "{{tab_id}}"
      keys: ["Delete"]
