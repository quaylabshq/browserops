schema_version: 1

name: mem0.request_magic_link
description: Open the Mem0 login page, type an email, and submit to trigger a magic-link send
kind: leaf
domain: mem0

triggers:
  - log in to mem0 with magic link
  - sign in to mem0
  - request mem0 magic link
  - mem0 login

tags: [mem0, auth, magic-link]

inputs:
  email:
    type: string
    required: true
    description: Email address that will receive the magic link

# Live UI snapshot (verified): app.mem0.ai/login renders an
# <input type=email name="Enter your email"> and a button
# "Continue with email". browser_type requires a ref from a prior
# a11y_tree read, so we read → bind page → reference {{page.refs.email}}
# (agent resolves the ref by role=textbox + name~="Enter your email").
steps:
  - id: navigate
    action: browser_navigate
    with:
      tab_id: "{{tab_id}}"
      url: https://app.mem0.ai/login

  - id: wait_for_form
    action: browser_wait_for
    with:
      tab_id: "{{tab_id}}"
      selector: "input[type='email']"
      timeout_ms: 15000

  - id: read_form
    action: browser_read
    with:
      tab_id: "{{tab_id}}"
      mode: a11y_tree
    bind: page

  - id: enter_email
    action: browser_type
    with:
      tab_id: "{{tab_id}}"
      ref: "{{page.refs.email}}"
      text: "{{input.email}}"
      clear_first: true

  - id: submit
    action: browser_click_by_text
    with:
      tab_id: "{{tab_id}}"
      text: "Continue with email"
      role: button
      match: exact
    wait_for:
      text: "magic link"

success_criteria:
  - selector_exists: "body"
