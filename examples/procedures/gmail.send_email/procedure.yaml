schema_version: 1

name: gmail.send_email
description: Compose and send a Gmail email via the compose deep-link URL, then close the tab
kind: leaf
domain: gmail

triggers:
  - send an email to
  - email someone about
  - compose a message to
  - write an email to

tags: [email, outreach]

inputs:
  to:
    type: string
    required: true
    description: "Recipient email address"
  subject:
    type: string
    required: true
    description: "Email subject line"
  body:
    type: string
    required: true
    description: "Plain-text email body (newlines preserved via %0A when encoded)"

# Deep-link pattern: one navigate replaces the old open-compose / fill-to /
# fill-subject / fill-body sequence. The agent substituting {{input.*}} into
# the URL MUST URL-encode each value (space -> %20, newline -> %0A, & -> %26,
# etc.) — the bridge template engine does not do this automatically and Gmail
# will silently mangle raw unescaped characters.
#
# The procedure opens a fresh tab (so closing it at the end does not disturb
# the user's inbox) and closes that tab once the "Message sent" toast fires.
steps:
  - id: open_compose
    action: browser_new_tab
    with:
      url: "https://mail.google.com/mail/?view=cm&fs=1&to={{input.to}}&su={{input.subject}}&body={{input.body}}"
      active: true
    bind: compose
    wait_for:
      text: "Send"
      timeout_ms: 20000

  - id: send
    action: browser_click_by_text
    with:
      tab_id: "{{compose.tab_id}}"
      text: "Send"
      role: button
      match: prefix
    wait_for:
      text: "Message sent"
      timeout_ms: 15000

  - id: close
    action: browser_close_tab
    with:
      tab_id: "{{compose.tab_id}}"

success_criteria:
  - toast_text: "Message sent"
