schema_version: 1

name: mem0.create_api_key
description: Generate a new API key in the Mem0 dashboard and return { api_key }
kind: leaf
domain: mem0

triggers:
  - create a mem0 api key
  - generate mem0 api key
  - new api key on mem0
  - get mem0 api key
  - make an api key for mem0

tags: [mem0, api-key]

inputs: {}

preconditions:
  - url_matches: "^https://app\\.mem0\\.ai/"
    fallback:
      action: browser_navigate
      with:
        tab_id: "{{tab_id}}"
        url: https://app.mem0.ai/dashboard/api-keys

# Verify on first run: the create-key route has been observed at both
# /dashboard/api-keys and /dashboard/get-started during onboarding.
# Mem0 API keys are prefixed "M0-"; extract waits for that prefix to
# appear in the DOM, then collects the visible token via JS.
steps:
  - id: navigate_api_keys
    action: browser_navigate
    with:
      tab_id: "{{tab_id}}"
      url: https://app.mem0.ai/dashboard/api-keys

  - id: wait_for_page
    action: browser_wait_for
    with:
      tab_id: "{{tab_id}}"
      text: "Generate API Key"
      timeout_ms: 15000

  - id: click_generate
    action: browser_click_by_text
    with:
      tab_id: "{{tab_id}}"
      text: "Generate API Key"
      role: button
      match: prefix
    wait_for:
      text: "M0-"

  - id: extract_key
    action: browser_execute_js
    with:
      tab_id: "{{tab_id}}"
      code: |
        (() => {
          // Mem0 API keys start with "M0-". Walk visible text nodes for
          // the longest plausible token; some UIs put it inside an <input
          // readonly> or a <code>/<pre>.
          const candidates = [];
          for (const el of document.querySelectorAll('input, textarea, code, pre, span, div')) {
            const v = (el.value !== undefined ? el.value : el.textContent) || "";
            const m = v.match(/M0-[A-Za-z0-9_-]{20,}/);
            if (m) candidates.push(m[0]);
          }
          const api_key = candidates.sort((a, b) => b.length - a.length)[0] || "";
          return { api_key };
        })()

success_criteria:
  - selector_exists: "body"
