schema_version: 1

name: mem0.complete_onboarding
description: Complete the post-login Mem0 onboarding form (company name + use case) and continue to the dashboard
kind: leaf
domain: mem0

triggers:
  - complete mem0 onboarding
  - finish mem0 setup
  - select mem0 use case
  - fill mem0 company name
  - continue mem0 onboarding

tags: [mem0, onboarding, auth]

inputs:
  company_name:
    type: string
    required: true
    description: Company name to enter in the onboarding form
  usecase:
    type: string
    required: true
    description: Use-case button label to select (e.g. "AI Companion", "Customer Support")

preconditions:
  - url_matches: "^https://app\\.mem0\\.ai/"
    fallback:
      action: browser_navigate
      with:
        tab_id: "{{tab_id}}"
        url: https://app.mem0.ai/login

# NOTE: Reaches this leaf only after a successful magic-link login.
# Selectors and labels reflect the previously observed onboarding form;
# verify against the live UI on first use and bump_success: true once a
# real run completes. The agent resolves {{form.refs.company}} from the
# bound a11y_tree by role=textbox and a name containing "company".
steps:
  - id: wait_for_form
    action: browser_wait_for
    with:
      tab_id: "{{tab_id}}"
      selector: "input[placeholder*='company name' i], input[name*='company' i]"
      timeout_ms: 15000

  - id: read_form
    action: browser_read
    with:
      tab_id: "{{tab_id}}"
      mode: a11y_tree
    bind: form

  - id: fill_company
    action: browser_type
    with:
      tab_id: "{{tab_id}}"
      ref: "{{form.refs.company}}"
      text: "{{input.company_name}}"
      clear_first: true

  - id: select_usecase
    action: browser_click_by_text
    with:
      tab_id: "{{tab_id}}"
      text: "{{input.usecase}}"
      role: button
      match: exact

  - id: continue
    action: browser_click_by_text
    with:
      tab_id: "{{tab_id}}"
      text: Continue
      role: button
      match: exact
    wait_for:
      text: "API Keys"

success_criteria:
  - url_matches: "^https://app\\.mem0\\.ai/dashboard"
