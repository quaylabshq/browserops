<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrowserOps — Options</title>
    <style>
      :root { color-scheme: light; }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #f7f6f2;
        color: #1b1b1b;
        margin: 0;
        padding: 32px;
      }
      main { max-width: 480px; margin: 0 auto; }
      h1 { font-size: 18px; margin: 0 0 16px; font-weight: 600; }
      form { display: grid; gap: 12px; }
      label { font-size: 12px; color: #555; display: grid; gap: 4px; }
      input {
        padding: 8px 10px;
        border: 1px solid #d8d4c8;
        border-radius: 8px;
        background: #fff;
        font-size: 14px;
        font-family: inherit;
      }
      input[type="password"] { font-family: ui-monospace, Menlo, monospace; }
      .row { display: flex; gap: 8px; }
      .row > label { flex: 1; }
      button {
        margin-top: 4px;
        padding: 9px 14px;
        border: 0;
        border-radius: 8px;
        background: #1b1b1b;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { background: #333; }
      .pill {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
      }
      .pill.on { background: #dcf5e3; color: #1b6b37; }
      .pill.off { background: #fde2e2; color: #8a1a1a; }
      .help { font-size: 12px; color: #666; margin-top: 16px; line-height: 1.5; }
      code { background: #eceae2; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
      .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
      .saved { font-size: 12px; color: #1b6b37; opacity: 0; transition: opacity .2s; }
      .saved.show { opacity: 1; }
    </style>
  </head>
  <body>
    <main>
      <h1>BrowserOps</h1>
      <div class="status-row">
        <span>Bridge:</span>
        <span id="status" class="pill off">disconnected</span>
      </div>
      <form id="form">
        <label>Token
          <input id="token" type="password" autocomplete="off" spellcheck="false" />
        </label>
        <div class="row">
          <label>Host<input id="host" type="text" value="127.0.0.1" /></label>
          <label>Port<input id="port" type="number" min="1" max="65535" value="8765" /></label>
        </div>
        <div>
          <button type="submit">Save &amp; reconnect</button>
          <span id="saved" class="saved">saved</span>
        </div>
      </form>
      <p class="help">
        Run the bridge locally; it writes a token to <code>~/.browserops/token</code>.
        Paste that token above, then save — the extension reconnects automatically.
      </p>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
