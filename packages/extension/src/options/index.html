<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrowserOps — Options</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <style>
      body { padding: 40px 32px; }
      main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
      .head { display: flex; flex-direction: column; gap: 4px; }
      .head__sub { color: var(--ink-45); }
      .status-row { display: flex; align-items: center; gap: 8px; }
      .form { display: grid; gap: 12px; }
      .form__row { display: flex; gap: 8px; }
      .form__row > label { flex: 1; }
      .form__actions { display: flex; align-items: center; gap: 10px; }
      .saved {
        font-size: var(--fs-10);
        color: var(--success-ink);
        opacity: 0;
        transition: opacity 150ms ease;
      }
      .saved.show { opacity: 1; }
      .help { color: var(--ink-45); line-height: var(--lh); }
      .help code {
        background: var(--ink-04);
        padding: 1px 5px;
        border-radius: var(--r-sm);
        font-size: var(--fs-10);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="head">
        <h1>BrowserOps</h1>
        <div class="head__sub">Bridge connection settings.</div>
      </div>

      <div class="card">
        <div class="status-row">
          <span class="muted">Bridge</span>
          <span id="status" class="pill pill--off">disconnected</span>
        </div>
      </div>

      <form id="form" class="card form">
        <label class="label">Token
          <input id="token" type="password" class="input input--mono" autocomplete="off" spellcheck="false" />
        </label>
        <div class="form__row">
          <label class="label">Host<input id="host" type="text" class="input" value="127.0.0.1" /></label>
          <label class="label">Port<input id="port" type="number" class="input" min="1" max="65535" value="8765" /></label>
        </div>
        <div class="form__actions">
          <button type="submit" class="btn">Save &amp; reconnect</button>
          <span id="saved" class="saved">saved</span>
        </div>
      </form>

      <p class="help">
        Most users won't need this page — click <strong>Run setup</strong> in the extension popup
        to pair automatically. Manual path: run the bridge, then paste the token from
        <code>~/.browserops/token</code> above and save.
      </p>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
