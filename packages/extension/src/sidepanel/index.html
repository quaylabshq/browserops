<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrowserOps Launcher</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <div class="panel">
      <header class="panel-head">
        <span class="panel-title">Launcher</span>
        <div class="head-right">
          <button id="new-session" type="button" class="link-btn" hidden>↻ New</button>
          <span id="status" class="pill pill--off" aria-live="polite">Disconnected</span>
        </div>
      </header>

      <div id="agents" class="agents" role="radiogroup" aria-label="Agent"></div>

      <!-- Shown only when disconnected: launching needs a live bridge. -->
      <div id="disconnected" class="notice">
        Not connected to the bridge. Open the BrowserOps popup and connect, then come back.
      </div>

      <div id="transcript" class="transcript" aria-live="polite">
        <div id="empty" class="empty">
          Send a message to launch your agent in a terminal. Your first message becomes its
          task; the conversation then continues in the terminal.
        </div>
      </div>

      <div id="context" class="context muted">current tab: …</div>

      <form id="composer" class="inputbar">
        <textarea
          id="message"
          class="message"
          rows="1"
          placeholder="Message…"
          aria-label="Message"
        ></textarea>
        <button id="send" type="submit" class="send" aria-label="Send">▸</button>
      </form>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
