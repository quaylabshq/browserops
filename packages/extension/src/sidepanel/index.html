<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrowserOps Chat</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <div id="panel" class="panel">
      <header class="head">
        <div class="head__id">
          <span
            id="status-dot"
            class="dot dot--off"
            role="status"
            title="Disconnected"
            aria-label="Disconnected"
          >
            <span class="dot__core"></span>
          </span>
          <span id="head-title" class="head__title">BrowserOps</span>
        </div>
        <div class="head__actions">
          <!-- View tabs — the chat ("Agent") and the recent-sessions list ("History"). -->
          <div id="tabs" class="tabs" role="tablist" aria-label="View">
            <button id="tab-agent" class="tab" type="button" role="tab" aria-selected="true">
              Agent
            </button>
            <button id="tab-history" class="tab" type="button" role="tab" aria-selected="false">
              History
            </button>
          </div>
          <button
            id="new-session"
            class="icon-btn"
            type="button"
            hidden
            title="New chat"
            aria-label="New chat"
          >
            ↻
          </button>
          <button
            id="term-mirror"
            class="icon-btn"
            type="button"
            hidden
            title="Open the live terminal"
            aria-label="Open terminal"
          >
            ▤
          </button>
          <button
            id="term-takeover"
            class="icon-btn"
            type="button"
            hidden
            title="Take over in your terminal"
            aria-label="Take over in your terminal"
          >
            ⤢
          </button>
          <button
            id="theme-toggle"
            class="icon-btn"
            type="button"
            title="Theme: Auto"
            aria-label="Theme: Auto"
          >
            ◐
          </button>
        </div>
      </header>

      <!-- The page the agent can see and drive — plus recent sessions to resume. -->
      <div id="context" class="context" hidden>
        <span id="context-fav" class="context__fav" aria-hidden="true"></span>
        <span id="context-label" class="context__label"></span>
        <span
          id="context-live"
          class="context__live"
          title="Agent can act on this tab"
          hidden
        ></span>
      </div>

      <div id="stream" class="stream" aria-live="polite" aria-label="Conversation">
        <div id="empty" class="empty">
          <span class="empty__logo" aria-label="BrowserOps">

            </svg>
          </span>
          <p class="empty__lead">An agent that drives this tab</p>
          <div id="empty-chips" class="empty__chips"></div>
        </div>
        <div id="disconnected" class="state" hidden>
          <p class="state__title">Bridge not connected</p>
          <p class="state__body">Open the BrowserOps popup and connect, then come back.</p>
        </div>
      </div>

      <!-- Recent sessions list (the "History" tab); shown only with .panel.view-history. -->
      <div id="history" class="history" aria-label="Recent sessions"></div>

      <!-- Full-window terminal view (macOS chrome); shown only with .panel.view-terminal. -->
      <div id="terminal-pane" class="terminal-pane">
        <div class="terminal">
          <div class="terminal__bar">
            <span class="terminal__dots">
              <button
                id="term-close"
                class="terminal__dot terminal__dot--red"
                type="button"
                title="Back to chat"
                aria-label="Back to chat"
              ></button>
              <span class="terminal__dot terminal__dot--yellow"></span>
              <span class="terminal__dot terminal__dot--green"></span>
            </span>
            <span id="terminal-title" class="terminal__title">session</span>
          </div>
          <div id="terminal-host" class="terminal-host"></div>
        </div>
      </div>

      <!-- Write mode — the typing experience. -->
      <form id="composer" class="composer">
        <div class="composer__box">
          <span class="composer__glyph" aria-hidden="true">
            <svg
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 5.5 6.5 8 4 10.5" />
              <path d="M8.5 10.5H12" />
            </svg>
          </span>
          <textarea
            id="message"
            class="composer__input"
            rows="1"
            placeholder="Type a command or ask a follow-up…"
            aria-label="Message"
          ></textarea>
          <button id="send" class="composer__send" type="submit" aria-label="Send">
            <span class="composer__send-label">Enter </span
            ><span class="composer__kbd" aria-hidden="true">↵</span>
          </button>
        </div>
        <div id="composer-hint" class="composer__hint">⏎ send · ⇧⏎ newline</div>
      </form>

      <!-- Read-only mode — live in an external terminal; replaces the composer. -->
      <div id="term-status" class="term-status" hidden>
        <div class="term-status__line">
          <span class="term-status__home">~</span>
          <span class="term-status__caret">❯</span>
          <span class="term-status__msg">listening via terminal</span>
          <span class="term-status__cursor" aria-hidden="true"></span>
        </div>
        <div class="term-status__meta">
          <span class="term-status__mode">Read-Only Mode</span>
          <button id="term-status-new" class="term-status__new" type="button">New chat</button>
        </div>
      </div>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
