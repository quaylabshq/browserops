<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrowserOps</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <style>
      html, body { width: 320px; }
      body {
        min-height: 200px;
        padding: 14px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .head { display: flex; align-items: center; justify-content: space-between; }
      .head h1 { font-size: var(--fs-13); }

      .status-row { display: flex; align-items: center; gap: 8px; }

      #main { display: flex; flex-direction: column; gap: 10px; }
      #main.hidden { display: none; }

      /* When no token is configured, collapse everything except the setup card. */
      #main.unconfigured > :not(#setup) { display: none; }

      /* --- setup card (first run) ------------------------------------ */
      #setup { display: none; }
      #setup.active { display: flex; flex-direction: column; gap: 8px; }
      #setup .setup-title { font-weight: 500; }
      #setup .setup-desc { color: var(--ink-45); }

      /* --- pinned section -------------------------------------------- */
      #pinned-section { display: flex; flex-direction: column; gap: 8px; }
      .pinned-empty { color: var(--ink-45); }
      .pinned-info { display: flex; flex-direction: column; gap: 2px; }
      .pinned-title {
        font-weight: 500;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pinned-url {
        font-family: var(--font-mono);
        font-size: var(--fs-10);
        color: var(--ink-45);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pinned-actions { display: flex; gap: 6px; }
      .pinned-actions .btn { flex: 1; height: 24px; padding: 0 8px; font-size: var(--fs-10); }

      /* --- yolo toggle ----------------------------------------------- */
      .yolo-row {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-60);
        cursor: pointer;
        user-select: none;
      }
      .yolo-row input { margin: 0; accent-color: var(--ink); }

      /* --- safety confirmation --------------------------------------- */
      #safety { display: none; }
      #safety.active { display: flex; flex-direction: column; gap: 8px; }
      .safety-tool {
        font-family: var(--font-mono);
        color: var(--ink-60);
      }
      .safety-reason { color: var(--ink); }
      .safety-actions { display: flex; gap: 6px; }
      .safety-actions .btn { flex: 1; }

      .spacer { flex: 1; min-height: 4px; }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>BrowserOps</h1>
      <span id="status" class="pill pill--off">disconnected</span>
    </div>

    <div id="safety" class="card card--danger">
      <div class="card__title">Confirm risky action</div>
      <div class="safety-tool" id="safety-tool"></div>
      <div class="safety-reason" id="safety-reason"></div>
      <div class="safety-actions">
        <button id="safety-allow" type="button" class="btn">Allow</button>
        <button id="safety-deny" type="button" class="btn btn--ghost">Deny</button>
      </div>
    </div>

    <div id="main">
      <div id="setup" class="card">
        <div class="setup-title">Finish setup</div>
        <div class="setup-desc">
          BrowserOps isn't paired with the bridge yet. Run setup to connect
          in one click — no token copy-paste needed.
        </div>
        <button id="run-setup" type="button" class="btn btn--block">Run setup</button>
      </div>

      <div id="pinned-section" class="card">
        <div class="card__title">Pinned tab</div>
        <div id="pinned-empty" class="pinned-empty">None — pin a tab to let agents use it as home base.</div>
        <div id="pinned-info" class="pinned-info" hidden>
          <div class="pinned-title" id="pinned-title"></div>
          <div class="pinned-url" id="pinned-url"></div>
        </div>
        <div class="pinned-actions">
          <button id="pin" type="button" class="btn">Use this tab</button>
          <button id="unpin" type="button" class="btn btn--ghost" hidden>Unpin</button>
        </div>
      </div>

      <label class="yolo-row" title="Session only. Cleared on browser restart or Disconnect.">
        <input type="checkbox" id="yolo" />
        <span>Auto-approve risky actions (this session)</span>
      </label>

      <div class="spacer"></div>
      <button id="kill" type="button" class="btn btn--danger">Disconnect</button>
      <a id="options" class="link">Open options</a>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
