<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrowserOps</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; padding: 0; }
      body {
        width: 320px;
        min-height: 200px;
        font-family: -apple-system, system-ui, sans-serif;
        background: #f7f6f2;
        color: #1b1b1b;
        padding: 16px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h1 { font-size: 14px; margin: 0; font-weight: 600; }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .pill {
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
      }
      .pill.on { background: #dcf5e3; color: #1b6b37; }
      .pill.off { background: #fde2e2; color: #8a1a1a; }
      button {
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: #c1121f;
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: #a00f19; }
      button:disabled { background: #d8b0b3; cursor: default; }
      button.allow { background: #1b6b37; }
      button.allow:hover { background: #145029; }
      .spacer { flex: 1; }
      a {
        font-size: 12px;
        color: #444;
        text-decoration: none;
        border-bottom: 1px dotted #999;
        align-self: flex-start;
        cursor: pointer;
      }
      a:hover { color: #000; }

      #safety {
        display: none;
        flex-direction: column;
        gap: 10px;
        border: 1px solid #e2c7c8;
        background: #fff6f6;
        border-radius: 8px;
        padding: 12px;
      }
      #safety.active { display: flex; }
      .safety-title {
        font-size: 13px;
        font-weight: 600;
        color: #8a1a1a;
      }
      .safety-tool {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: #333;
      }
      .safety-reason {
        font-size: 12px;
        color: #1b1b1b;
      }
      .safety-actions {
        display: flex;
        gap: 8px;
      }
      .safety-actions button { flex: 1; }
      #main.hidden { display: none; }
      .yolo-row {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: #333;
        cursor: pointer;
        user-select: none;
      }
      .yolo-row input { margin: 0; }
      #pinned-section {
        border: 1px solid #e2e2dc;
        border-radius: 8px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: #fbfaf6;
      }
      .pinned-label {
        font-size: 11px;
        font-weight: 600;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .pinned-empty { font-size: 12px; color: #777; }
      .pinned-info { font-size: 12px; }
      .pinned-title {
        font-weight: 500;
        color: #1b1b1b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pinned-url {
        color: #666;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pinned-actions { display: flex; gap: 6px; }
      button.neutral {
        background: #1b1b1b;
        color: #fff;
        padding: 6px 10px;
        font-size: 12px;
        flex: 1;
      }
      button.neutral:hover { background: #000; }
    </style>
  </head>
  <body>
    <h1>BrowserOps</h1>
    <div id="safety">
      <div class="safety-title">Confirm risky action</div>
      <div class="safety-tool" id="safety-tool"></div>
      <div class="safety-reason" id="safety-reason"></div>
      <div class="safety-actions">
        <button id="safety-allow" class="allow" type="button">Allow</button>
        <button id="safety-deny" type="button">Deny</button>
      </div>
    </div>
    <div id="main">
      <div class="status">
        <span>Bridge:</span>
        <span id="status" class="pill off">disconnected</span>
      </div>

      <div id="pinned-section">
        <div class="pinned-label">Pinned tab</div>
        <div id="pinned-empty" class="pinned-empty">None — pin a tab to let agents use it as home base.</div>
        <div id="pinned-info" class="pinned-info" hidden>
          <div class="pinned-title" id="pinned-title"></div>
          <div class="pinned-url" id="pinned-url"></div>
        </div>
        <div class="pinned-actions">
          <button id="pin" type="button" class="neutral">Use this tab</button>
          <button id="unpin" type="button" class="neutral" hidden>Unpin</button>
        </div>
      </div>

      <label class="yolo-row" title="Session only. Cleared on browser restart or Disconnect.">
        <input type="checkbox" id="yolo" />
        <span>Auto-approve risky actions (this session)</span>
      </label>
      <div class="spacer"></div>
      <button id="kill" type="button">Disconnect</button>
      <a id="options">Open options</a>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
